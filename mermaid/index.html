<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mermaid 实时编辑器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <a href="../index.html" class="back-home-btn" title="返回首页">🏠 返回首页</a>
  <h1>🧜 Mermaid 实时编辑器</h1>
  <select id="theme" title="图表主题">
    <option value="default">默认主题</option>
    <option value="neutral">中性</option>
    <option value="forest">森林</option>
    <option value="dark">暗色</option>
    <option value="base">基础</option>
  </select>
  <button id="btn-template" title="载入内置模板">📋 模板</button>
  <div class="mode-switch" id="mode-switch" title="视图模式">
    <button type="button" data-mode="code">代码</button>
    <button type="button" data-mode="split" class="active">分屏</button>
    <button type="button" data-mode="preview">预览</button>
  </div>
  <span class="spacer"></span>
  <button id="btn-svg">下载 SVG</button>
  <button id="btn-png">下载 PNG</button>
  <button id="btn-pdf" class="primary">下载 PDF</button>
</header>

<main>
  <section class="pane editor">
    <textarea id="code" spellcheck="false"></textarea>
  </section>
  <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" title="拖动调整宽度，双击恢复默认"></div>
  <section class="pane preview">
    <div id="output"></div>
    <div id="error" hidden></div>
  </section>
</main>

<!-- 模板选择对话框 -->
<div class="modal-overlay" id="templateModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>📋 选择图表模板</h3>
      <button class="modal-close" id="closeModal" title="关闭">✕</button>
    </div>
    <div class="modal-body">
      <div class="template-grid" id="templateGrid">
        <!-- 模板卡片由 templates.js 的数据动态生成 -->
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="js/templates.js"></script>
<script src="js/script.js"></script>
</body>
</html>
